<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img"><title>词频与例句面板</title><rect width="900" height="460" rx="24" fill="#f1f5fa"/><g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif"><text x="34" y="52" fill="#263c53" font-size="28" font-weight="700">词频与例句面板</text><text x="34" y="86" fill="#61768b" font-size="16" font-weight="400">将已返回的统计和例句按字段整理，避免数字串位</text><rect x="34" y="111" width="832" height="286" rx="16" fill="#fff" stroke="#d3dfeb"/><text x="63" y="153" fill="#263c53" font-size="24" font-weight="700">hello · 词频与例句</text><text x="64" y="200" fill="#61768b" font-size="17" font-weight="400">阅读次数</text><text x="64" y="248" fill="#226e9a" font-size="34" font-weight="700">11</text><text x="260" y="200" fill="#61768b" font-size="17" font-weight="400">听力次数</text><text x="260" y="248" fill="#226e9a" font-size="34" font-weight="700">22</text><text x="456" y="200" fill="#61768b" font-size="17" font-weight="400">答案词次数</text><text x="456" y="248" fill="#226e9a" font-size="34" font-weight="700">33</text><text x="652" y="200" fill="#61768b" font-size="17" font-weight="400">出现概率</text><text x="652" y="248" fill="#226e9a" font-size="34" font-weight="700">75.00%</text><text x="64" y="293" fill="#263c53" font-size="22" font-weight="400">Hello! This sentence is a synthetic reading example.</text><text x="64" y="333" fill="#61768b" font-size="16" font-weight="400">Synthetic reading · Example 1</text><text x="64" y="371" fill="#263c53" font-size="17" font-weight="400">来自页面响应的数据 · 独立面板 · 缺失字段保留为暂无数据</text><text x="34" y="434" fill="#6a7e92" font-size="14" font-weight="400">公开版 · 合成界面 / 流程示意</text></g></svg>